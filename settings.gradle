rootProject.name = 'datamask'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

include 'datamask-bom'
include 'datamask-api'
include 'datamask-core'
include 'datamask-processor'
include 'datamask-jackson'
include 'datamask-logback'
include 'datamask-log4j2'
include 'datamask-opentelemetry'
include 'datamask-kafka'
include 'datamask-jdbc'
include 'datamask-jpa'
include 'datamask-ai'
include 'datamask-spring-boot-autoconfigure'
include 'datamask-spring-boot-starter'

// Verification only, never published: it holds every module on its test classpath and asserts the
// dependencies between them. It has to be last, because it depends on all of the above.
include 'datamask-architecture-tests'
