name: PR

on:
  pull_request:
    branches: [main]

# A new push to the branch supersedes the run already in flight; only the latest commit's
# verdict is worth paying for.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Axion derives the version from the tags and the branch position, and a shallow
          # clone has neither. The root build deliberately disables axion's own checks so a
          # detached CI checkout with a merge commit still resolves a version.
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      # `build` runs spotlessCheck, the tests, the architecture rules and the 80% coverage gate,
      # so formatting, behaviour, structure and coverage are one gate rather than four a
      # contributor can pass part of. It compiles the JMH benchmarks but never runs them —
      # see .github/workflows/benchmarks.yml and datamask-benchmarks/build.gradle.
      - name: Build
        run: ./gradlew build --info

      # Both run even when the build failed, because a failed gate is exactly when its report
      # is worth reading.
      - name: Publish the test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-report

      - name: Publish the coverage report
        if: ${{ !cancelled() }}
        uses: ./.github/actions/coverage-report

      # The summary above carries the failures; this is the browsable HTML and the raw JUnit
      # XML, for a failure that needs the whole trace or a tool that wants to parse it.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test
            **/build/test-results/*/*.xml
          retention-days: 7
