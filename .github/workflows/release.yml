name: Release

# Publishing a GitHub release is the trigger. The release carries the tag, the tag carries
# the version, and axion reads it back out — so the version is decided in one place by the
# person cutting the release, not recomputed here.
on:
  release:
    types: [published]

# Needed to attach the jars to the release, and to put it back into draft if the upload to
# Central fails.
permissions:
  contents: write

# Two releases must never race each other onto Central.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Central has no concept of a pre-release, and axion resolves a version only for a
      # release tag. Say so plainly rather than fail later on a confusing version mismatch.
      - name: Refuse to publish a pre-release
        if: github.event.release.prerelease
        run: |
          echo "::error::${{ github.event.release.tag_name }} is marked as a pre-release. Maven Central publishes releases only."
          exit 1

      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          # The release event's SHA is the tag's, but naming the tag makes the checkout
          # explicit. Full history and tags, because that is what axion derives from.
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      # A commit sitting exactly on a release tag resolves to the plain version, with no
      # `-rc-` or `-alpha` decoration. If it does not, the release was cut from a tag axion
      # does not recognise, and publishing it would put a mislabelled artifact on Central.
      - name: Resolve the version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q currentVersion -Prelease.quiet)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' resolves to version '$VERSION'. A release tag must be 'v<version>', matching axion's tag prefix."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # The same gate a pull request has to pass, run again on the exact tagged tree.
      - name: Verify
        run: ./gradlew build

      # Signs every artifact, uploads the bundle to the Central Portal and blocks until the
      # portal's validation comes back. No `clean` is needed: unlike the old dispatch flow,
      # the version never changes mid-run — the tag already existed at checkout.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral

      # Maven Central is where the artifacts are consumed from; these are attached for
      # convenience and so the release is self-describing.
      - name: Attach the jars to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t ARTIFACTS < <(find . -path '*/build/libs/*.jar' | sort)
          gh release upload "$TAG" "${ARTIFACTS[@]}" --clobber

      # The release is already public by the time this workflow starts, so a failed upload
      # would otherwise leave a release advertising a version that never reached Central.
      # Putting it back into draft keeps the repository honest until the run is repeated.
      - name: Return the release to draft if publishing failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.event.release.tag_name }}" --draft

      - name: Summarise
        run: |
          {
            echo "### Released \`$VERSION\`"
            echo
            echo "- Maven Central: \`ch.raph.datamask:datamask-core:$VERSION\`"
            echo "- Release: ${{ github.event.release.html_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
