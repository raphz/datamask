// Everything a Java module in this build needs except a route to Maven Central. Modules that
// ship apply datamask.java-conventions, which is this plus publishing; a module that exists only
// to verify the others applies this one directly, so it can never be published by accident.
plugins {
    id 'java-library'
    id 'datamask.spotless-conventions'
    id 'datamask.coverage-conventions'
}

def libs = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // The sources and javadoc jars Central requires are registered by
    // datamask.publishing-conventions, so they are not declared a second time here.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 25 is the published baseline: the current LTS, and what the library's crypto
    // (javax.crypto.KDF) and language level are written against.
    options.release = 25
    // Required so the reflective plan compiler can recover constructor parameter names
    // for non-record beans, and so Spring can bind @ConfigurationProperties constructors.
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:all,-serial,-processing'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

dependencies {
    // JSpecify's nullness annotations, on every module so `@NullMarked` package-info files and the
    // `@Nullable` positions they force can be written anywhere in the library.
    //
    // compileOnly, not api: the annotations have to be invisible in every published POM. datamask-api
    // claims zero dependencies so a domain module can carry @PII without taking on anything, and that
    // claim is load-bearing — it is why ModuleDependencyTest holds datamask-api to the JDK. Nothing
    // reads these at runtime (a checker reads them at compile time, from the class files), and a
    // missing annotation type is simply skipped by reflection, so leaving them off the runtime
    // classpath costs nothing. JSpecify's own docs recommend shipping the jar rather than hiding it;
    // that recommendation is overridden here, deliberately, by the zero-dependency guarantee.
    compileOnly libs.findLibrary('jspecify').get()
    testCompileOnly libs.findLibrary('jspecify').get()

    testImplementation platform(libs.findLibrary('junit-bom').get())
    testImplementation libs.findLibrary('junit-jupiter').get()
    testImplementation libs.findLibrary('assertj-core').get()
    testRuntimeOnly libs.findLibrary('junit-platform-launcher').get()
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
