plugins {
    id 'java-library'
    id 'maven-publish'
    id 'datamask.spotless-conventions'
}

def libs = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')

java {
    // Built with the JDK the developer already has (25); `options.release` below is what
    // actually gates the bytecode level, so no second toolchain needs provisioning.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 21 is the published baseline: it is what most banking estates run today.
    options.release = 21
    // Required so the reflective plan compiler can recover constructor parameter names
    // for non-record beans, and so Spring can bind @ConfigurationProperties constructors.
    options.compilerArgs << '-parameters'
    options.compilerArgs << '-Xlint:all,-serial,-processing'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

dependencies {
    testImplementation platform(libs.findLibrary('junit-bom').get())
    testImplementation libs.findLibrary('junit-jupiter').get()
    testImplementation libs.findLibrary('assertj-core').get()
    testRuntimeOnly libs.findLibrary('junit-platform-launcher').get()
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = 'DataMask - PII never accidentally reaches logs, traces or AI prompts.'
                url = 'https://github.com/raphz/datamask'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
        }
    }
}
