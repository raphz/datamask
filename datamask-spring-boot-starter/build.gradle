plugins {
    id 'datamask.java-conventions'
}

description = 'The one dependency a Spring Boot application adds to get DataMask wired everywhere.'

// A starter has no classes, so there is no package to match; the derived
// ch.raph.datamask.spring.boot.starter is kept as its identity. It still gets a name because the jar
// is published and would otherwise be an automatic module named after its file, and because the name
// must not collide with datamask-spring-boot-autoconfigure's ch.raph.datamask.spring.
automaticModuleName = 'ch.raph.datamask.spring.boot.starter'

dependencies {
    api project(':datamask-core')
    api project(':datamask-spring-boot-autoconfigure')

    // No integration module is pulled in here, and that is deliberate. datamask-logback and
    // datamask-log4j2 carry mutually exclusive logging backends, so a starter that brought one
    // would break every application that chose the other; datamask-jackson brings jackson-databind,
    // which a non-web application does not otherwise have. The auto-configuration activates each of
    // them on sight, so an application adds the line for the channel it actually uses and gets the
    // wiring for free. See datamask-spring-boot-starter/README.md.
}

// A starter carries no code of its own.
tasks.named('javadoc') { enabled = false }
