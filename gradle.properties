# Sequential on purpose. Spotless does not support parallel execution: with org.gradle.parallel on,
# roughly half of the `clean build` runs measured here failed, either with a NoClassDefFoundError
# thrown from inside a formatter or with Gradle unable to fingerprint spotless's own
# lineEndingsPolicy input. Both are open upstream bugs with no fix — diffplug/spotless#2850,
# diffplug/spotless#2391 — and dropping a formatting step does not avoid them: removing cleanthat()
# was measured and made no difference. A build that is green half the time is worth less than the
# few seconds parallel execution would save on fourteen small modules.
org.gradle.parallel=false

# Unchanged modules are served from the cache instead of recompiled. In CI the cache is restored by
# gradle/actions/setup-gradle, so a change confined to one module does not rebuild the rest.
org.gradle.caching=true

# Test JVMs are forked separately; this is the daemon that configures the build and compiles it.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
