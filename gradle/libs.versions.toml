# Versions are deliberately aligned with the set managed by Spring Boot 4.1.0 so that the
# starter is drop-in compatible with a Boot application's dependency management.
[versions]
slf4j = "2.0.18"
logback = "1.5.34"
log4j2 = "2.25.4"
jackson = "3.1.4"
kafka = "4.2.1"
opentelemetry = "1.62.0"
micrometer = "1.17.0"
springBoot = "4.1.0"
jakartaPersistence = "3.2.0"
junit = "6.0.3"
assertj = "3.27.7"
spotless = "8.9.0"
palantirJavaFormat = "2.97.0"
axion = "1.21.3"

[plugins]
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion" }

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
log4j2-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j2" }
log4j2-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j2" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakartaPersistence" }

spring-boot = { module = "org.springframework.boot:spring-boot", version.ref = "springBoot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-actuator", version.ref = "springBoot" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Consumed by buildSrc, not by any published module.
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
