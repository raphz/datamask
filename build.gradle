plugins {
    id 'base'
    id 'com.diffplug.spotless'
    id 'jacoco'
    id 'jacoco-report-aggregation'
    alias(libs.plugins.axion.release)
}

// The library is verified as one artifact, so coverage is measured across every module together.
// A per-module threshold would fail a module that is three annotations and pass one that is a
// thousand well-tested lines with an untested integration hanging off it.
def coverageMinimum = 0.80

// Whether a snapshot cut from a feature branch carries the commit hash. Set
// datamask.snapshotVersionWithCommitHash=false in gradle.properties to drop it.
def snapshotVersionWithCommitHash = !project.hasProperty('datamask.snapshotVersionWithCommitHash')
        || Boolean.parseBoolean(project.property('datamask.snapshotVersionWithCommitHash').toString())

scmVersion {
    // Only main produces release candidates. Everything else is an alpha, so a feature-branch
    // build can never be mistaken for one in a repository.
    snapshotCreator { version, position ->
        if (position.branch != 'main') {
            snapshotVersionWithCommitHash ? '-alpha-' + position.shortRevision : '-alpha'
        } else {
            '-rc-' + position.shortRevision
        }
    }
    versionCreator 'versionWithBranch'
    versionIncrementer 'incrementMinor'

    repository {
        pushTagsOnly = true
    }

    // The version must be derivable in CI from a shallow, detached checkout with local changes,
    // so none of these guards apply. Release gating belongs in the pipeline, not in versioning.
    checks {
        uncommittedChanges = false
        aheadOfRemote = false
        snapshotDependencies = false
    }

    tag {
        // Coerced explicitly: this is a Property holding a SAM type, not a Property holding a Closure.
        initialVersion = { rules, position -> '0.1.0' } as
                pl.allegro.tech.build.axion.release.domain.properties.TagProperties.InitialVersionSupplier
    }
}

// A repository with no commits has no HEAD, so axion has nothing to derive a version from. That is
// only ever true before the very first commit; falling back keeps the build configurable until then.
def resolvedVersion
try {
    resolvedVersion = scmVersion.version
} catch (pl.allegro.tech.build.axion.release.domain.scm.ScmException scmProblem) {
    if (!(scmProblem.cause instanceof org.eclipse.jgit.api.errors.NoHeadException)) {
        throw scmProblem
    }
    resolvedVersion = '0.1.0-SNAPSHOT'
    logger.lifecycle('DataMask: repository has no commits yet, using {}', resolvedVersion)
}

allprojects {
    group = 'ch.raph.datamask'
    version = resolvedVersion
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

// Every module that carries code feeds the aggregate. The BOM is a java-platform, so it has no
// classes to contribute; datamask-architecture-tests has none of its own either, and coverage is a
// statement about the library's tests rather than about the rules that police its structure. The
// same goes for datamask-benchmarks: it is measurement code with no tests of its own, and letting a
// few hundred uncovered instructions of benchmark harness into the aggregate would move the gate
// without saying anything about the library.
dependencies {
    rootProject.subprojects
            .findAll {
                it.name != 'datamask-bom'
                        && it.name != 'datamask-architecture-tests'
                        && it.name != 'datamask-benchmarks'
            }
            .each { jacocoAggregation project(it.path) }
}

// The root project has no test suite of its own, so the aggregated report has to be declared
// explicitly and told which suite of the contributing projects to collect.
reporting {
    reports {
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = 'test'
        }
    }
}

def aggregatedCoverageReport = tasks.named('testCodeCoverageReport', JacocoReport)

// Reads the aggregate the report task already assembled — class dirs, sources and exec data —
// rather than re-deriving them, so the number the gate enforces is the number the report shows.
tasks.register('coverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = "Fails the build when aggregated coverage across all modules is below ${(coverageMinimum * 100) as int}%."

    executionData.from(aggregatedCoverageReport.map { it.executionData })
    classDirectories.from(aggregatedCoverageReport.map { it.classDirectories })
    sourceDirectories.from(aggregatedCoverageReport.map { it.sourceDirectories })

    violationRules {
        rule {
            // INSTRUCTION is the counter least sensitive to formatting and compiler details, so
            // the threshold means the same thing after a reformat as it did before.
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = coverageMinimum
            }
        }
    }
}

// Coverage joins formatting and tests as one gate rather than a separate opt-in step, so
// `./gradlew build` is the whole verdict a contributor has to pass. The aggregate needs every
// module's tests to have run, which is why it hangs off the root project's `check`.
tasks.named('check') {
    dependsOn tasks.named('coverageVerification')
}

// Non-Java formatting is declared once, on the root project only. Declaring it per project would
// make every subproject's glob reach back up and format the same files several times over.
spotless {
    format 'misc', {
        target '**/*.gradle', '**/*.md', '**/.gitignore'
        targetExclude '**/build/**', '**/.gradle/**', '**/.idea/**'
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
}
